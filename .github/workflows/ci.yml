name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR instead of burning minutes on them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  server-tests:
    name: memory server tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Cache the local embedding model
        # test_memory_index.py's real Chroma round-trip downloads Chroma's
        # default embedding model (~80MB) on first use. Without this, every
        # CI run re-downloads it from scratch. Keyed on the server
        # dependency file so a chromadb version bump gets a fresh model.
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-model-${{ hashFiles('server/requirements.txt') }}

      - name: Run the server's own test suite
        # Explicit module targets, not `discover` — test_client.py and
        # test_oauth_flow.py in the same directory are manual smoke tests
        # that talk to a live server/tunnel and are not meant to run here.
        run: cd server && python -m unittest test_server test_memory_index -v

  validate-schema:
    name: schema is valid JSON
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse every JSON file in the repository
        run: |
          python - <<'PY'
          import json, pathlib, sys

          failed = False
          for path in pathlib.Path(".").rglob("*.json"):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  print(f"::error file={path}::{exc}")
                  failed = True
              else:
                  print(f"ok: {path}")
          sys.exit(1 if failed else 0)
          PY
