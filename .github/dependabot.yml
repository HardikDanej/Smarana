version: 2
updates:
  # Smṛti has no runtime dependencies; the only moving parts are the CI
  # actions themselves and the single test-time pin in requirements-dev.txt.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
